<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cyber Hub Website</title>

  <style>
    body {
      margin: 0;
      background: #061633;
      text-align: center;
      font-family: Arial, sans-serif;
    }

    .website-image {
      display: block;
      width: 100%;
      height: auto;
    }

    .social-buttons {
      padding: 25px 15px 35px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 15px;
    }

    .social-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 220px;
      padding: 15px 25px;
      border-radius: 50px;
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      box-shadow: 0 6px 18px rgba(0,0,0,0.35);
      transition: 0.3s;
    }

    .social-btn:hover {
      transform: translateY(-4px);
    }

    .whatsapp-btn {
      background: #25D366;
    }

    .whatsapp-btn:hover {
      background: #128C7E;
    }

    .instagram-btn {
      background: linear-gradient(
        45deg,
        #f09433,
        #e6683c,
        #dc2743,
        #cc2366,
        #bc1888
      );
    }

    .instagram-btn:hover {
      opacity: 0.9;
    }

    .icon {
      font-size: 23px;
    }

    @media (max-width: 600px) {
      .social-buttons {
        flex-direction: column;
        align-items: center;
      }

      .social-btn {
        width: 80%;
        max-width: 320px;
      }
    }
  </style>
</head>

<body>

  <!-- आपकी वेबसाइट की मुख्य image -->
  <img
    src="cyber-hub-website-image.png"
    alt="Cyber Hub Website Design"
    class="website-image"
  >

  <!-- WhatsApp और Instagram Buttons -->
  <div class="social-buttons">

    <a
      href="https://wa.me/918873301032"
      target="_blank"
      rel="noopener noreferrer"
      class="social-btn whatsapp-btn"
    >
      <span class="icon">💬</span>
      WhatsApp पर संपर्क करें
    </a>

    <a
      href="https://www.instagram.com/rdx__abhishek__08/"
      target="_blank"
      rel="noopener noreferrer"
      class="social-btn instagram-btn"
    >
      <span class="icon">📸</span>
      Instagram पर Follow करें
    </a>

  </div>

</body>
</html>
